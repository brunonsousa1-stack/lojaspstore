<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minha conta · SP Store</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap"></noscript>
<link rel="stylesheet" href="/css/loja.css">
<style>
.narrow{max-width:460px;margin:0 auto}
.hello{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h1{font-size:clamp(28px,4vw,36px)}
.menu{display:flex;gap:8px;flex-wrap:wrap}
.ped{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.ped + .ped{margin-top:12px}
.ped > button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 18px}
.ped > button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.ped .thumbs{display:flex}
.ped .thumbs span{width:48px;height:48px;border-radius:10px;overflow:hidden;background:var(--bg);border:2px solid var(--surface);margin-left:-14px}
.ped .thumbs span:first-child{margin-left:0}
.ped .thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.ped .meta b{display:block;font-size:15px}
.ped .meta small{color:var(--muted);font-size:13px}
.ped .rt{text-align:right;display:grid;gap:6px;justify-items:end}
.ped .rt strong{font-variant-numeric:tabular-nums}
.ped .det{border-top:1px solid var(--line);padding:16px 18px;display:grid;gap:18px;grid-template-columns:1fr 1fr}
.ped .det h3{font-family:var(--body);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.ped .det .full{grid-column:1/-1}
@media (max-width:640px){.ped > button{grid-template-columns:1fr auto}.ped .thumbs{display:none}.ped .det{grid-template-columns:1fr}}
.vazio{text-align:center;padding:40px 16px}
</style>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/img/icone-180.png">
</head><body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="SP Store, voltar à loja"><img src="/img/logo.png" alt="SP Store"></a>
  <a class="back" href="/">← Voltar à loja</a>
</div></header>
<main><div class="wrap" id="app"><p class="muted">Carregando…</p></div></main>
<footer class="foot"><div class="wrap"><span>© 2026 SP Store</span><span><a href="/trocas.html">Trocas e devoluções</a> · <a href="/privacidade.html">Privacidade</a> · <a href="/termos.html">Termos de uso</a> · <a href="/#duvidas">Dúvidas frequentes</a></span></div></footer>

<script src="/js/conta.js"></script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const brl=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digitos=t=>String(t||"").replace(/\D/g,"");
const data=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
const dataHora=d=>new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtTel=v=>{v=digitos(v).slice(0,11);if(v.length<3)return v;if(v.length<=6)return `(${v.slice(0,2)}) ${v.slice(2)}`;return v.length===11?`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`:`(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`};
const corTxt=c=>c&&c!=="Padrão"?c:"";
let aba="entrar", pedidos=[], aberto=null, tela="pedidos", aviso="", WA="5511947523834";
const PASSOS=[["aguardando_pagamento","Pedido feito"],["pago","Pagamento aprovado"],["enviado","Enviado"],["entregue","Entregue"]];

function carregando(btn,on,txt){if(!btn)return;if(on){btn.dataset.t=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${txt||"Aguarde…"}`}else{btn.disabled=false;if(btn.dataset.t)btn.innerHTML=btn.dataset.t}}
function verSenha(){app.querySelectorAll("[data-ver]").forEach(b=>b.addEventListener("click",()=>{const i=b.previousElementSibling;i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Mostrar":"Ocultar"}))}

// ---------- sem login ----------
function telaEntrar(msg){
  app.innerHTML=`<div class="narrow"><div class="card">
    <div class="eyebrow">Minha conta</div><h2 style="margin:6px 0 4px">${aba==="criar"?"Criar conta":aba==="esqueci"?"Esqueci a senha":"Entrar"}</h2>
    <p class="sub">${aba==="esqueci"?"Enviamos um link para você criar uma senha nova.":"Acompanhe seus pedidos, pagamentos e o rastreio da entrega."}</p>
    ${aba!=="esqueci"?`<div class="tabs" role="tablist"><button role="tab" type="button" data-aba="entrar" aria-selected="${aba==="entrar"}">Entrar</button><button role="tab" type="button" data-aba="criar" aria-selected="${aba==="criar"}">Criar conta</button></div>`:""}
    ${aba!=="esqueci"?`<div id="g-box" hidden></div>`:""}
    <form class="form" id="f" novalidate>
      <label class="f">E-mail<input class="in" type="email" name="email" autocomplete="email" required></label>
      ${aba!=="esqueci"?`<label class="f">${aba==="criar"?"Crie uma senha":"Senha"}<span class="pass"><input class="in" type="password" name="senha" autocomplete="${aba==="criar"?"new-password":"current-password"}" required><button type="button" data-ver>Mostrar</button></span></label>`:""}
      ${aba==="criar"?`<p class="hint">Pelo menos 6 caracteres.</p>`:""}
      <div class="msg ${msg&&msg.ok?"ok":"bad"}" id="m" role="alert">${msg?esc(msg.t):""}</div>
      <button class="btn btn-dark btn-block" type="submit">${aba==="criar"?"Criar conta":aba==="esqueci"?"Enviar link":"Entrar"}</button>
      ${aba==="entrar"?`<button class="link" type="button" data-aba="esqueci" style="justify-self:start">Esqueci a senha</button>`:aba==="esqueci"?`<button class="link" type="button" data-aba="entrar" style="justify-self:start">Voltar</button>`:""}
    </form></div></div>`;
  app.querySelectorAll("[data-aba]").forEach(b=>b.addEventListener("click",()=>{aba=b.dataset.aba;telaEntrar()}));
  verSenha();
  Conta.montarGoogle($("#g-box"));
  $("#f").addEventListener("submit",async e=>{
    e.preventDefault(); const f=e.target,m=$("#m"),btn=f.querySelector("[type=submit]"); m.className="msg bad"; m.textContent="";
    const email=f.email.value.trim();
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.textContent="Digite um e-mail válido.";return}
    try{
      if(aba==="esqueci"){carregando(btn,true,"Enviando…");await Conta.esqueci(email);carregando(btn,false);m.className="msg ok";m.textContent=`Se existir uma conta com ${email}, o link chega em instantes. Confira também o spam.`;return}
      if(aba==="criar"&&Conta.senhaFraca(f.senha.value)){m.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
      carregando(btn,true,aba==="criar"?"Criando…":"Entrando…");
      if(aba==="criar"){const r=await Conta.criar(email,f.senha.value);if(!r.entrou){carregando(btn,false);m.className="msg info";m.innerHTML=`<b>Confirme seu e-mail.</b> Enviamos um link para <b>${esc(email)}</b>. Toque em <b>Confirmar e-mail</b> e sua conta fica pronta. Confira também o spam.`;return}}
      else await Conta.entrar(email,f.senha.value);
      await iniciarLogado();
    }catch(err){carregando(btn,false);m.textContent=err.message}
  });
}
function telaNovaSenha(){
  app.innerHTML=`<div class="narrow"><div class="card"><div class="eyebrow">Minha conta</div><h2 style="margin:6px 0 12px">Crie uma senha nova</h2>
    <form class="form" id="f" novalidate><label class="f">Nova senha<span class="pass"><input class="in" type="password" name="senha" autocomplete="new-password" required><button type="button" data-ver>Mostrar</button></span></label>
    <p class="hint">Pelo menos 6 caracteres.</p><div class="msg bad" id="m" role="alert"></div>
    <button class="btn btn-dark btn-block" type="submit">Salvar senha</button></form></div></div>`;
  verSenha();
  $("#f").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,m=$("#m"),btn=f.querySelector("[type=submit]");
    if(Conta.senhaFraca(f.senha.value)){m.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
    carregando(btn,true,"Salvando…");try{await Conta.novaSenha(f.senha.value);aviso="Senha alterada com sucesso.";await iniciarLogado()}catch(err){carregando(btn,false);m.textContent=err.message}});
}

// ---------- logado ----------
function passoAtual(p){return PASSOS.findIndex(x=>x[0]===p.status)}
function linhaTempo(p){
  if(p.status==="cancelado") return `<ul class="tl"><li class="on">Pedido cancelado<small>${dataHora((p.historico.find(h=>h.status==="cancelado")||{}).em||p.criado_em)}</small></li></ul>`;
  const at=passoAtual(p);
  return `<ul class="tl">${PASSOS.map(([s,t],i)=>{const h=(p.historico||[]).find(x=>x.status===s);return `<li class="${i<=at?"on":""}">${t}${h&&i<=at?`<small>${dataHora(h.em)}</small>`:""}</li>`}).join("")}</ul>`;
}
function pedidoHTML(p){
  const a=p.endereco||{}, n=p.itens.reduce((s,x)=>s+x.qtd,0), open=aberto===p.id;
  return `<article class="ped" id="pedido-${p.id}">
  <button type="button" data-abrir="${p.id}" aria-expanded="${open}">
    <span class="thumbs">${p.itens.slice(0,3).map(x=>`<span>${x.foto?`<img src="${esc(x.foto)}" alt="" loading="lazy">`:""}</span>`).join("")}</span>
    <span class="meta"><b>Pedido #${p.id}</b><small>${data(p.criado_em)} · ${n} ${n===1?"item":"itens"}</small></span>
    <span class="rt"><span class="badge st-${p.status}">${esc(p.status_texto)}</span><strong>${brl(p.total)}</strong></span>
  </button>
  ${open?`<div class="det">
    ${p.status==="aguardando_pagamento"?(p.pix_informado?`<div class="full msg info">Recebemos seu aviso de Pix. Estamos conferindo o pagamento e você recebe um e-mail assim que for confirmado.</div>`:`<div class="full msg info" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><span>Este pedido ainda não foi pago.</span><a class="btn btn-green btn-sm" href="/checkout.html?pedido=${p.id}&t=${p.token}">Pagar agora</a></div>`):""}
    ${p.rastreio?`<div class="full"><h3>Rastreio</h3><div class="code"><span id="r-${p.id}">${esc(p.rastreio)}</span><button class="btn btn-gold btn-sm" type="button" data-copiar="r-${p.id}">Copiar</button><a class="btn btn-line btn-sm" href="https://www.melhorrastreio.com.br/rastreio/${encodeURIComponent(p.rastreio.split(",")[0].trim())}" target="_blank" rel="noopener">Rastrear entrega</a></div></div>`:""}
    <div><h3>Acompanhamento</h3>${linhaTempo(p)}</div>
    <div><h3>Entrega</h3><p style="margin:0;font-size:14px">${esc(p.nome)}<br>${esc(a.rua)}, ${esc(a.numero)}${a.complemento?" - "+esc(a.complemento):""}<br>${esc(a.bairro)} · ${esc(a.cidade)}/${esc(a.uf)}<br>CEP ${esc(String(a.cep||"").replace(/(\d{5})(\d{3})/,"$1-$2"))}</p>
      ${p.envio&&p.envio.nome?`<p style="margin:8px 0 0;font-size:13px" class="muted">${esc(p.envio.nome)}${p.envio.empresa&&p.envio.empresa!==p.envio.nome?" · "+esc(p.envio.empresa):""}${p.envio.prazo?` · até ${p.envio.prazo} dias úteis após o envio`:""}</p>`:""}
      ${p.forma_pagamento?`<h3 style="margin-top:14px">Pagamento</h3><p style="margin:0;font-size:14px">${esc(p.forma_pagamento)}</p>`:""}</div>
    <div class="full"><h3>Itens</h3><ul class="itens">${p.itens.map(x=>`<li><div class="th">${x.foto?`<img src="${esc(x.foto)}" alt="">`:""}</div><div><b>${esc(x.nome)}</b><span>${corTxt(x.cor)?esc(x.cor)+" · ":""}${x.qtd}×</span>${x.gratis?`<span style="display:block;color:#17703c;font-weight:600">🎁 ${x.gratis} grátis na promoção</span>`:""}</div><div class="v">${(x.gratis?`<s style="font-weight:400;font-size:12px;opacity:.7;display:block">${brl(x.preco*x.qtd)}</s>`:"")+brl(x.preco*(x.qtd-(x.gratis||0)))}</div></li>`).join("")}</ul>
      <div class="tot"><div><span class="muted">Frete</span><span>${p.frete>0?brl(p.frete):"Grátis"}</span></div><div class="grand"><span>Total</span><strong>${brl(p.total)}</strong></div></div></div>
    <div class="full" style="display:flex;gap:10px;flex-wrap:wrap">${["enviado","entregue"].includes(p.status)?`<a class="btn btn-gold btn-sm" href="/avaliar.html?pedido=${p.id}&t=${encodeURIComponent(p.token)}">★ Avaliar compra</a>`:""}<a class="btn btn-line btn-sm" href="https://wa.me/${WA}?text=${encodeURIComponent(`Olá! Tenho uma dúvida sobre o pedido #${p.id}.`)}" target="_blank" rel="noopener">Falar sobre este pedido no WhatsApp</a></div>
  </div>`:""}</article>`;
}
function telaLogado(){
  const u=Conta.usuario()||{}, d=u.user_metadata||{}, primeiro=String(d.nome||d.full_name||d.name||"").split(" ")[0];
  app.innerHTML=`<div style="max-width:820px;margin:0 auto">
    <div class="hello"><div><div class="eyebrow">Minha conta</div><h1>${primeiro?`Olá, ${esc(primeiro)}!`:"Olá!"}</h1><p class="muted" style="margin:2px 0 0;font-size:14px">${esc(u.email||"")}</p></div>
    <div class="menu"><button class="btn btn-sm ${tela==="pedidos"?"btn-dark":"btn-line"}" data-tela="pedidos" type="button">Meus pedidos</button><button class="btn btn-sm ${tela==="dados"?"btn-dark":"btn-line"}" data-tela="dados" type="button">Meus dados</button><button class="btn btn-sm btn-line" id="sair" type="button">Sair</button></div></div>
    ${aviso?`<div class="msg ok" style="margin-bottom:14px">${esc(aviso)}</div>`:""}
    <div id="corpo"></div></div>`;
  aviso="";
  app.querySelectorAll("[data-tela]").forEach(b=>b.addEventListener("click",()=>{tela=b.dataset.tela;telaLogado()}));
  $("#sair").addEventListener("click",async()=>{await Conta.sair();aba="entrar";telaEntrar({ok:true,t:"Você saiu da conta."})});
  tela==="dados"?telaDados():telaPedidos();
}
function telaPedidos(){
  const c=$("#corpo");
  if(!pedidos.length){c.innerHTML=`<div class="card vazio"><h2>Nenhum pedido ainda</h2><p class="muted">Quando você comprar, seus pedidos aparecem aqui com o status e o rastreio.</p><a class="btn btn-dark" href="/#vitrine">Ver produtos</a></div>`;return}
  c.innerHTML=pedidos.map(pedidoHTML).join("");
  c.querySelectorAll("[data-abrir]").forEach(b=>b.addEventListener("click",()=>{const id=+b.dataset.abrir;aberto=aberto===id?null:id;telaPedidos();if(aberto){try{history.replaceState(null,"","#pedido-"+id)}catch(e){}}}));
  c.querySelectorAll("[data-copiar]").forEach(b=>b.addEventListener("click",()=>{const t=document.getElementById(b.dataset.copiar).textContent;navigator.clipboard.writeText(t).then(()=>{b.textContent="Copiado ✓"}).catch(()=>{})}));
}
function telaDados(){
  const u=Conta.usuario()||{}, d=u.user_metadata||{};
  $("#corpo").innerHTML=`<div class="card"><h2>Meus dados</h2><p class="sub">Usamos estes dados para preencher a entrega mais rápido.</p>
    <form class="form" id="fd" novalidate><label class="f">Nome completo<input class="in" name="nome" autocomplete="name" value="${esc(d.nome||d.full_name||d.name||"")}"></label>
    <label class="f">Celular com DDD<input class="in" name="telefone" inputmode="tel" value="${esc(fmtTel(d.telefone||""))}"></label>
    <div class="msg" id="md" role="status"></div><button class="btn btn-dark" type="submit" style="justify-self:start">Salvar</button></form></div>
    <div class="card"><h2>Trocar senha</h2><form class="form" id="fs" novalidate style="margin-top:12px">
    <label class="f">Nova senha<span class="pass"><input class="in" type="password" name="senha" autocomplete="new-password"><button type="button" data-ver>Mostrar</button></span></label>
    <p class="hint">Pelo menos 6 caracteres.</p><div class="msg" id="ms" role="status"></div><button class="btn btn-dark" type="submit" style="justify-self:start">Trocar senha</button></form></div>`;
  verSenha();
  const fd=$("#fd"); fd.telefone.addEventListener("input",()=>{fd.telefone.value=fmtTel(fd.telefone.value)});
  fd.addEventListener("submit",async e=>{e.preventDefault();const m=$("#md"),btn=fd.querySelector("[type=submit]");carregando(btn,true,"Salvando…");
    try{await Conta.atualizarDados({nome:fd.nome.value.trim(),telefone:digitos(fd.telefone.value)});m.className="msg ok";m.textContent="Dados salvos."}catch(err){m.className="msg bad";m.textContent=err.message}carregando(btn,false)});
  const fs=$("#fs"); fs.addEventListener("submit",async e=>{e.preventDefault();const m=$("#ms"),btn=fs.querySelector("[type=submit]");m.className="msg bad";
    if(Conta.senhaFraca(fs.senha.value)){m.textContent="A senha precisa ter pelo menos 6 caracteres.";return}
    carregando(btn,true,"Salvando…");try{await Conta.novaSenha(fs.senha.value);m.className="msg ok";m.textContent="Senha alterada.";fs.reset()}catch(err){m.textContent=err.message}carregando(btn,false)});
}
async function iniciarLogado(){
  app.innerHTML=`<p class="wait muted" style="display:flex;gap:10px;align-items:center"><span class="spin"></span>Carregando seus pedidos…</p>`;
  await Conta.carregarUsuario();
  if(!Conta.sessao()){telaEntrar({t:"Sua sessão expirou. Entre de novo."});return}
  try{const d=await Conta.api("/api/meus-pedidos");pedidos=d.pedidos||[]}
  catch(e){if(e.status===401){telaEntrar({t:"Sua sessão expirou. Entre de novo."});return}pedidos=[];aviso=""}
  const m=location.hash.match(/^#pedido-(\d+)/); if(m) aberto=+m[1]; else if(pedidos.length===1) aberto=pedidos[0].id;
  telaLogado();
  if(m){const el=document.getElementById("pedido-"+m[1]); if(el) el.scrollIntoView({block:"start"})}
}
(async function(){
  fetch("/data/loja.json",{cache:"no-store"}).then(r=>r.json()).then(L=>{if(L&&L.whatsapp)WA=digitos(L.whatsapp)}).catch(()=>{});
  const cfg=await Conta.config();
  if(!cfg.pronto){app.innerHTML=`<div class="narrow"><div class="card"><h2>Minha conta</h2><p class="muted">A área do cliente estará disponível em breve. Para acompanhar um pedido, fale com a gente pelo WhatsApp.</p><a class="btn btn-green" href="https://wa.me/${WA}" target="_blank" rel="noopener">Falar no WhatsApp</a></div></div>`;return}
  const link=Conta.lerLinkDoEmail();
  if(link&&link.erro){aba="esqueci";telaEntrar({t:link.erro});return}
  if(link&&link.tipo==="recovery"){telaNovaSenha();return}
  if(link&&link.tipo==="signup") aviso="E-mail confirmado! Sua conta está pronta.";
  if(Conta.sessao()) await iniciarLogado(); else { if(location.hash.startsWith("#pedido-")) telaEntrar({ok:true,t:"Entre na sua conta para ver o pedido."}); else telaEntrar(); }
})();
</script>
</body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pedidos · Painel SP Store</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/loja.css">
<style>
.wrap{max-width:1180px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi small{display:block;font-size:12px;color:var(--muted);font-weight:600}
.kpi b{font-family:var(--display);font-weight:400;font-size:26px;font-variant-numeric:tabular-nums}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar .in{max-width:280px;min-height:42px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{font-style:normal;opacity:.65;margin-left:4px}
.lista{display:grid;gap:10px}
.o{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.o > button{all:unset;box-sizing:border-box;width:100%;cursor:pointer;display:grid;grid-template-columns:80px 1.4fr 1fr auto auto;gap:12px;align-items:center;padding:12px 16px;font-size:14px}
.o > button:focus-visible{outline:2px solid var(--gold);outline-offset:-2px}
.o .num{font-weight:700}
.o .num small,.o .cli small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.o .val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
@media (max-width:760px){.o > button{grid-template-columns:1fr auto}.o .itn,.o .cli small{display:none}}
.od{border-top:1px solid var(--line);padding:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
@media (max-width:900px){.od{grid-template-columns:1fr}}
.od h3{font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.od p{margin:0;font-size:14px}
.acts{display:grid;gap:10px}
.acts .in{min-height:44px}
.copy{border:0;background:none;color:var(--gold);font:700 12px var(--body);cursor:pointer;padding:0;margin-left:6px}
</style>
</head><body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="Ver a loja"><img src="/img/logo.png" alt="SP Store"></a>
  <b style="font-family:var(--display);font-weight:400;font-size:20px">Pedidos</b>
  <button class="back" type="button" id="cfg-btn" hidden style="background:none;cursor:pointer;font:inherit;font-weight:600;font-size:14px">Configurações de envio</button>
  <a class="back" href="/admin/" style="margin-left:0">Painel de produtos</a>
</div></header>
<main><div class="wrap" id="app"><p class="muted">Carregando…</p></div></main>

<script src="/js/conta.js"></script>
<script>
const $=s=>document.querySelector(s), app=$("#app");
const brl=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digitos=t=>String(t||"").replace(/\D/g,"");
const dh=d=>new Date(d).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const fmtTel=v=>{v=digitos(v);return v.length===11?`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`:v.length===10?`(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`:v};
const corTxt=c=>c&&c!=="Padrão"?c:"";
const ROT={todos:"Todos",pago:"A enviar",aguardando_pagamento:"Aguardando pagamento",enviado:"Enviados",entregue:"Entregues",cancelado:"Cancelados"};
let todos=[], filtro="pago", busca="", aberto=null, confirmar=null, ENVIO=null, tela="lista";

function entrar(msg){
  app.innerHTML=`<div style="max-width:420px;margin:0 auto" class="card"><div class="eyebrow">Somente a loja</div><h2 style="margin:6px 0 4px">Entrar no painel de pedidos</h2>
  <p class="sub">Use a conta com o e-mail da loja.</p>
  <form class="form" id="f" novalidate><label class="f">E-mail<input class="in" type="email" name="email" autocomplete="email"></label>
  <label class="f">Senha<span class="pass"><input class="in" type="password" name="senha" autocomplete="current-password"><button type="button" data-ver>Mostrar</button></span></label>
  <div class="msg bad" id="m" role="alert">${msg?esc(msg):""}</div><button class="btn btn-dark btn-block" type="submit">Entrar</button></form>
  <p class="hint" style="margin-top:12px">Ainda não tem conta com o e-mail da loja? <a href="/conta.html">Crie aqui</a> e confirme o e-mail.</p></div>`;
  app.querySelector("[data-ver]").addEventListener("click",e=>{const i=e.target.previousElementSibling;i.type=i.type==="password"?"text":"password"});
  $("#f").addEventListener("submit",async e=>{e.preventDefault();const f=e.target,m=$("#m");m.textContent="";try{await Conta.entrar(f.email.value,f.senha.value);carregar()}catch(err){m.textContent=err.message}});
}
async function carregar(){
  try{const [d,e]=await Promise.all([Conta.api("/api/admin/pedidos"),Conta.api("/api/admin/envio").catch(()=>null)]);todos=d.pedidos||[];ENVIO=e; if(!window.__carregou){window.__carregou=1; if(todos.some(p=>p.status==="aguardando_pagamento"&&p.pix_informado)) filtro="aguardando_pagamento";}
    const cb=$("#cfg-btn");cb.hidden=false;cb.onclick=()=>{tela=tela==="cfg"?"lista":"cfg";render()};
    if(ENVIO&&ENVIO.melhorEnvio&&!ENVIO.remetente) tela="cfg"; render()}
  catch(e){if(e.status===401)return entrar();if(e.status===403){await Conta.sair();return entrar(e.message)}app.innerHTML=`<div class="msg bad">${esc(e.message)}</div>`}
}
function kpis(){
  const pagos=todos.filter(p=>["pago","enviado","entregue"].includes(p.status));
  const hoje=new Date();hoje.setHours(0,0,0,0);const sete=Date.now()-7*864e5;
  const soma=l=>l.reduce((a,p)=>a+Number(p.total),0);
  const pagoEm=p=>{const h=(p.historico||[]).find(x=>x.status==="pago");return new Date(h?h.em:p.criado_em).getTime()};
  return `<div class="kpis">
    <div class="kpi"><small>A enviar</small><b>${todos.filter(p=>p.status==="pago").length}</b>${todos.some(p=>p.status==="aguardando_pagamento"&&p.pix_informado)?`<small style="color:var(--wa);margin-top:4px">${todos.filter(p=>p.status==="aguardando_pagamento"&&p.pix_informado).length} Pix para conferir</small>`:""}</div>
    <div class="kpi"><small>Vendas hoje</small><b>${brl(soma(pagos.filter(p=>pagoEm(p)>=hoje.getTime())))}</b></div>
    <div class="kpi"><small>Últimos 7 dias</small><b>${brl(soma(pagos.filter(p=>pagoEm(p)>=sete)))}</b></div>
    <div class="kpi"><small>Pedidos pagos</small><b>${pagos.length}</b></div></div>`;
}
function lista(){
  const q=busca.trim().toLowerCase();
  return todos.filter(p=>(filtro==="todos"||p.status===filtro)&&(!q||String(p.id).includes(q)||String(p.nome).toLowerCase().includes(q)||String(p.email).toLowerCase().includes(q)||String(p.rastreio).toLowerCase().includes(q)));
}
function render(){
  if(tela==="cfg") return telaCfg();
  const cont=k=>k==="todos"?todos.length:todos.filter(p=>p.status===k).length;
  const l=lista();
  app.innerHTML=`${ENVIO&&ENVIO.melhorEnvio?`<div class="msg info" style="margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><span>Melhor Envio conectado${ENVIO.saldo!=null?` · saldo <b>${brl(ENVIO.saldo)}</b>`:""}</span><a href="https://melhorenvio.com.br/painel/gerenciar/carteira" target="_blank" rel="noopener" style="font-weight:700">Adicionar saldo</a></div>`:""}${kpis()}
  <div class="bar"><div class="chips" role="group" aria-label="Filtrar">${Object.keys(ROT).map(k=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${filtro===k}">${ROT[k]}<i>${cont(k)}</i></button>`).join("")}</div>
  <input class="in" type="search" id="busca" placeholder="Buscar pedido, nome ou e-mail" value="${esc(busca)}" style="margin-left:auto">
  <button class="btn btn-line btn-sm" type="button" id="atualizar">Atualizar</button></div>
  <div class="lista">${l.length?l.map(pedido).join(""):`<div class="card" style="text-align:center"><p class="muted" style="margin:0">Nenhum pedido ${filtro==="todos"?"":"em “"+ROT[filtro]+"”"}.</p></div>`}</div>`;
  app.querySelectorAll("[data-f]").forEach(b=>b.addEventListener("click",()=>{filtro=b.dataset.f;aberto=null;render()}));
  const bi=$("#busca"); bi.addEventListener("input",()=>{busca=bi.value;const pos=bi.selectionStart;render();const n=$("#busca");n.focus();n.setSelectionRange(pos,pos)});
  $("#atualizar").addEventListener("click",carregar);
  app.querySelectorAll("[data-abrir]").forEach(b=>b.addEventListener("click",()=>{const id=+b.dataset.abrir;aberto=aberto===id?null:id;confirmar=null;render()}));
  app.querySelectorAll("[data-copiar]").forEach(b=>b.addEventListener("click",()=>{navigator.clipboard.writeText(b.dataset.copiar).then(()=>{b.textContent="copiado ✓"}).catch(()=>{})}));
  app.querySelectorAll("[data-acao]").forEach(b=>b.addEventListener("click",()=>acao(+b.dataset.id,b.dataset.acao,b)));
}
function pedido(p){
  const a=p.endereco||{}, open=aberto===p.id, n=p.itens.reduce((s,x)=>s+x.qtd,0);
  const endTxt=`${a.rua}, ${a.numero}${a.complemento?" - "+a.complemento:""} - ${a.bairro} - ${a.cidade}/${a.uf} - CEP ${String(a.cep||"").replace(/(\d{5})(\d{3})/,"$1-$2")}`;
  return `<article class="o"><button type="button" data-abrir="${p.id}" aria-expanded="${open}">
    <span class="num">#${p.id}<small>${dh(p.criado_em)}</small></span>
    <span class="cli">${esc(p.nome)}<small>${esc(p.email)}</small></span>
    <span class="itn muted">${n} ${n===1?"item":"itens"}</span>
    <span class="badge st-${p.status}">${p.status==="aguardando_pagamento"&&p.pix_informado?"Pix para conferir":esc(p.status_texto)}</span>
    <span class="val">${brl(p.total)}</span></button>
  ${open?`<div class="od">
    <div><h3>Cliente</h3><p><b>${esc(p.nome)}</b><br>${esc(p.email)}<br><a href="https://wa.me/55${digitos(p.telefone).replace(/^55/,"")}" target="_blank" rel="noopener">${esc(fmtTel(p.telefone))}</a>${p.cpf?`<br>CPF ${esc(String(p.cpf).replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,"$1.$2.$3-$4"))}`:""}</p>
      <h3 style="margin-top:14px">Entrega <button class="copy" type="button" data-copiar="${esc(p.nome+" - "+endTxt)}">copiar</button></h3><p>${esc(a.rua)}, ${esc(a.numero)}${a.complemento?" - "+esc(a.complemento):""}<br>${esc(a.bairro)}<br>${esc(a.cidade)}/${esc(a.uf)} · CEP ${esc(String(a.cep||"").replace(/(\d{5})(\d{3})/,"$1-$2"))}</p>
      ${p.envio&&p.envio.nome?`<h3 style="margin-top:14px">Envio escolhido</h3><p>${esc(p.envio.nome)}${p.envio.empresa&&p.envio.empresa!==p.envio.nome?" · "+esc(p.envio.empresa):""}${p.envio.prazo?` · até ${p.envio.prazo} dias úteis`:""}<br><span class="muted">Frete cobrado: ${p.frete>0?brl(p.frete):"grátis"}</span></p>`:""}</div>
    <div><h3>Itens</h3><ul class="itens">${p.itens.map(x=>`<li style="grid-template-columns:44px 1fr auto"><div class="th" style="width:44px;height:44px">${x.foto?`<img src="${esc(x.foto)}" alt="">`:""}</div><div><b>${x.qtd}× ${esc(x.nome)}</b><span>${esc(corTxt(x.cor))}</span></div><div class="v">${brl(x.preco*x.qtd)}</div></li>`).join("")}</ul>
      <div class="tot"><div><span class="muted">Frete</span><span>${p.frete>0?brl(p.frete):"Grátis"}</span></div><div><b>Total</b><b>${brl(p.total)}</b></div></div>
      <p class="hint" style="margin-top:8px">${p.forma_pagamento?esc(p.forma_pagamento)+" · ":""}${p.mp_pagamento?"Mercado Pago nº "+esc(p.mp_pagamento):"sem pagamento"}</p></div>
    <div class="acts"><h3>Ações</h3><div class="msg bad" id="am-${p.id}" role="alert"></div>${acoes(p)}</div>
  </div>`:""}</article>`;
}
function etiquetaHTML(p){
  const e=p.envio_completo||{}; if(!ENVIO||!ENVIO.melhorEnvio||!e.id||e.id==="fixo") return "";
  if(e.etiqueta_url) return `<a class="btn btn-gold" href="${esc(e.etiqueta_url)}" target="_blank" rel="noopener">Imprimir etiqueta</a><button class="link" type="button" data-acao="etiqueta" data-id="${p.id}" style="justify-self:start">Gerar link de impressão de novo</button>`;
  if(p.status!=="pago") return "";
  return `<label class="f">Chave da NF-e <small>(opcional: sem ela vai como declaração de conteúdo)</small><input class="in" id="nfe-${p.id}" inputmode="numeric" placeholder="44 números"></label>
    <button class="btn btn-gold" type="button" data-acao="etiqueta" data-id="${p.id}">Gerar etiqueta (${esc(e.nome||"")}) e avisar cliente</button>
    <p class="hint">Compra a etiqueta com o saldo do Melhor Envio, preenche o rastreio e envia o e-mail ao cliente.</p><div style="border-top:1px solid var(--line);margin:4px 0"></div><p class="hint" style="margin:0">Ou, se enviou por fora, digite o rastreio:</p>`;
}
function acoes(p){
  if(p.status==="pago"||p.status==="enviado") return `${etiquetaHTML(p)}
    <label class="f">Código de rastreio<input class="in" id="ras-${p.id}" value="${esc(p.rastreio)}" placeholder="Ex.: AA123456789BR" style="text-transform:uppercase"></label>
    ${p.status==="pago"?`<button class="btn btn-dark" type="button" data-acao="enviado" data-id="${p.id}">Marcar como enviado e avisar cliente</button>`:`<button class="btn btn-line" type="button" data-acao="rastreio" data-id="${p.id}">Salvar código corrigido</button><button class="btn btn-dark" type="button" data-acao="entregue" data-id="${p.id}">Marcar como entregue</button>`}
    <p class="hint">O cliente recebe um e-mail ${p.status==="pago"?"com o código de rastreio":"avisando"}.</p>
    <button class="link" type="button" data-acao="cancelado" data-id="${p.id}" style="justify-self:start;color:var(--bad)">${confirmar===p.id?"Toque de novo para confirmar o cancelamento":"Cancelar pedido"}</button>`;
  if(p.status==="aguardando_pagamento"&&p.forma_pagamento==="Pix direto") return `${p.pix_informado?`<div class="msg info"><b>O cliente informou que fez o Pix.</b> Confira no extrato do Mercado Pago um Pix de <b>${brl(p.total)}</b> (identificação SPSTORE${p.id}).</div>`:`<p class="hint">Pix gerado, mas o cliente ainda não avisou que pagou. Se o valor de ${brl(p.total)} entrou no Mercado Pago, pode confirmar.</p>`}
    <button class="btn btn-green" type="button" data-acao="pago" data-id="${p.id}">${confirmar===p.id+"-pago"?"Toque de novo: o Pix entrou mesmo?":"Confirmar Pix recebido"}</button>
    <p class="hint">O cliente recebe na hora o e-mail de compra confirmada.</p>
    <button class="link" type="button" data-acao="cancelado" data-id="${p.id}" style="justify-self:start;color:var(--bad)">${confirmar===p.id?"Toque de novo para confirmar":"Cancelar pedido"}</button>`;
  if(p.status==="aguardando_pagamento") return `<p class="hint">O cliente ainda não pagou. Pedidos sem pagamento não precisam de ação.</p><button class="link" type="button" data-acao="cancelado" data-id="${p.id}" style="justify-self:start;color:var(--bad)">${confirmar===p.id?"Toque de novo para confirmar":"Cancelar pedido"}</button>`;
  if(p.status==="entregue") return `<p class="hint">Pedido concluído.</p>`;
  return `<p class="hint">Pedido cancelado. Se o cliente pagou, faça a devolução no Mercado Pago (Atividade › pagamento › Devolver).</p>`;
}
async function acao(id,tipo,btn){
  const p=todos.find(x=>x.id===id), m=$("#am-"+id); m.textContent="";
  if(tipo==="cancelado"&&confirmar!==id){confirmar=id;render();return}
  if(tipo==="pago"&&confirmar!==id+"-pago"){confirmar=id+"-pago";render();return}
  if(tipo==="etiqueta"){
    const nf=$("#nfe-"+id); btn.disabled=true; const t0=btn.textContent; btn.innerHTML=`<span class="spin"></span>Gerando etiqueta…`;
    try{const d=await Conta.api("/api/admin/etiqueta",{method:"POST",body:JSON.stringify({id,nfe:nf?nf.value:""})});const i=todos.findIndex(x=>x.id===id);todos[i]={...todos[i],...d.pedido};render();
      if(d.etiqueta_url){ if(filtro!=="todos"&&filtro!==todos[i].status) filtro=todos[i].status; aberto=id; render(); const mm=$("#am-"+id); if(mm){mm.className="msg ok";mm.textContent="Etiqueta pronta! Toque em Imprimir etiqueta."} }
      Conta.api("/api/admin/envio").then(e=>{ENVIO=e}).catch(()=>{});
    }catch(e){btn.disabled=false;btn.textContent=t0;m.textContent=e.message}
    return}
  const ras=$("#ras-"+id), corpo={id,status:tipo==="rastreio"?p.status:tipo};
  if(ras) corpo.rastreio=ras.value.trim();
  if(tipo==="enviado"&&!corpo.rastreio){m.textContent="Digite o código de rastreio.";ras.focus();return}
  btn.disabled=true; const t=btn.textContent; btn.innerHTML=`<span class="spin"></span>Salvando…`;
  try{const d=await Conta.api("/api/admin/pedidos",{method:"POST",body:JSON.stringify(corpo)});const i=todos.findIndex(x=>x.id===id);todos[i]={...todos[i],...d.pedido};confirmar=null;render()}
  catch(e){btn.disabled=false;btn.textContent=t;m.textContent=e.message}
}
function telaCfg(){
  const r=(ENVIO&&ENVIO.remetente)||{cep:"08020360",numero:"33"};
  const fC=v=>String(v||"").replace(/\D/g,"").replace(/(\d{5})(\d{3})/,"$1-$2");
  app.innerHTML=`<div style="max-width:720px;margin:0 auto"><div class="card"><div class="eyebrow">Melhor Envio</div><h2 style="margin:6px 0 4px">Configurações de envio</h2>
    <p class="sub">Dados do remetente que vão nas etiquetas. ${ENVIO&&ENVIO.melhorEnvio?`Melhor Envio conectado${ENVIO.saldo!=null?` · saldo ${brl(ENVIO.saldo)}`:""}.`:`<b>Falta colocar o ME_TOKEN no Cloudflare</b> para gerar etiquetas.`}</p>
    <form class="form" id="fr" novalidate>
      <label class="f">Razão social ou nome da loja<input class="in" name="nome" value="${esc(r.nome||"")}"></label>
      <div class="row"><label class="f">CNPJ<input class="in" name="cnpj" inputmode="numeric" value="${esc(r.cnpj||"")}"></label><label class="f">Inscrição estadual <small>(opcional)</small><input class="in" name="ie" value="${esc(r.ie||"")}" placeholder="ou deixe vazio"></label></div>
      <div class="row"><label class="f">Telefone com DDD<input class="in" name="telefone" inputmode="tel" value="${esc(r.telefone||"")}"></label><label class="f">E-mail<input class="in" name="email" type="email" value="${esc(r.email||"")}"></label></div>
      <div class="row r3"><label class="f">CEP<input class="in" name="cep" inputmode="numeric" value="${esc(fC(r.cep))}"></label><span></span><span></span></div>
      <label class="f">Rua<input class="in" name="rua" value="${esc(r.rua||"")}"></label>
      <div class="row"><label class="f">Número<input class="in" name="numero" value="${esc(r.numero||"")}"></label><label class="f">Complemento <small>(opcional)</small><input class="in" name="complemento" value="${esc(r.complemento||"")}"></label></div>
      <label class="f">Bairro<input class="in" name="bairro" value="${esc(r.bairro||"")}"></label>
      <div class="row r3"><label class="f">Cidade<input class="in" name="cidade" value="${esc(r.cidade||"")}"></label><span></span><label class="f">UF<input class="in" name="uf" maxlength="2" value="${esc(r.uf||"")}" style="text-transform:uppercase"></label></div>
      <div class="msg" id="mr" role="status"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-dark" type="submit">Salvar</button><button class="btn btn-line" type="button" id="voltar">Voltar aos pedidos</button></div>
    </form></div></div>`;
  const f=$("#fr"); $("#voltar").onclick=()=>{tela="lista";render()};
  const cepBusca=async()=>{const c=digitos(f.cep.value);if(c.length!==8)return;try{const d=await fetch(`https://viacep.com.br/ws/${c}/json/`).then(x=>x.json());if(!d.erro){if(d.logradouro&&!f.rua.value)f.rua.value=d.logradouro;if(d.bairro&&!f.bairro.value)f.bairro.value=d.bairro;if(!f.cidade.value)f.cidade.value=d.localidade||"";if(!f.uf.value)f.uf.value=d.uf||""}}catch(e){}};
  f.cep.addEventListener("input",cepBusca); cepBusca();
  f.addEventListener("submit",async e=>{e.preventDefault();const m=$("#mr"),btn=f.querySelector("[type=submit]");const corpo=Object.fromEntries(new FormData(f));

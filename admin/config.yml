# Painel da SP Store (Decap CMS)
backend:
  name: github
  repo: brunonsousa1-stack/lojaspstore
  branch: main

locale: pt
site_url: https://lojaspstore.com.br
logo_url: https://lojaspstore.com.br/img/logo.png
media_folder: img
public_folder: /img

collections:
  - name: loja
    label: Banner e textos
    editor: { preview: false }
    files:
      - name: config
        label: Textos e contato
        file: data/loja.json
        fields:
          - { label: WhatsApp (só números, com 55 e DDD), name: whatsapp, widget: string }
          - { label: WhatsApp como aparece no site, name: whatsapp_exibicao, widget: string }
          - { label: "Mercado Livre: nota da loja", name: ml_nota, widget: string, required: false, hint: "Ex.: 4,8. Aparece na faixa 'Loja oficial no Mercado Livre'. Vazio = faixa não aparece." }
          - { label: "Mercado Livre: vendas", name: ml_vendas, widget: string, required: false, hint: "Ex.: +5 mil. Use o número real mostrado no Mercado Livre." }
          - { label: "Mercado Livre: link da sua loja", name: ml_link, widget: string, required: false, hint: "Ex.: https://www.mercadolivre.com.br/loja/spstore" }
          - { label: "Mercado Livre: título da faixa", name: ml_titulo, widget: string, required: false, hint: "Padrão: Loja oficial no Mercado Livre" }
          - { label: "Pixel do Meta (Facebook/Instagram): ID", name: meta_pixel_id, widget: string, required: false, hint: "Só os números. Gerenciador de Eventos do Meta > Fontes de dados." }
          - { label: "Google Analytics 4: ID", name: ga4_id, widget: string, required: false, hint: "Começa com G-. Ex.: G-ABC123XYZ" }
          - { label: "Razão social (rodapé)", name: razao_social, widget: string, required: false }
          - { label: "CNPJ (rodapé)", name: cnpj, widget: string, required: false }
          - { label: "Endereço (rodapé)", name: endereco_loja, widget: string, required: false }
          - { label: "E-mail de atendimento", name: email_atendimento, widget: string, required: false, hint: "Aparece no rodapé e na página de trocas." }
          - { label: Preço destaque do banner, name: preco_destaque, widget: number, value_type: float, step: 0.01 }
          - { label: Preço do kit óculos + relógio, name: preco_kit, widget: number, value_type: float, step: 0.01 }
          - { label: "Frete fixo (só se o Melhor Envio estiver desligado)", name: frete_valor, widget: number, value_type: float, step: 0.01, min: 0, required: false, default: 0, hint: "Com o Melhor Envio ligado, o frete é calculado pelo CEP. Ex.: 15.90" }
          - { label: "Chave Pix (para receber direto, sem taxa)", name: pix_chave, widget: string, required: false, hint: "E-mail, CPF/CNPJ (só números), celular com +55 ou chave aleatória. Deixe vazio para desligar o Pix direto." }
          - { label: "Nome do recebedor do Pix", name: pix_nome, widget: string, required: false, hint: "Como aparece no Pix. Ex.: LOJA SP STORE LTDA" }
          - { label: "Cidade do recebedor do Pix", name: pix_cidade, widget: string, required: false, default: "SAO PAULO" }
          - label: "Transportadoras que aparecem no site"
            name: frete_transportadoras
            widget: select
            multiple: true
            required: false
            hint: "Só estas opções aparecem para o cliente. Deixe vazio para mostrar todas."
            options:
              - { label: "Correios PAC", value: correios-pac }
              - { label: "Correios SEDEX", value: correios-sedex }
              - { label: "Correios Mini Envios", value: correios-mini }
              - { label: "Jadlog .Com", value: jadlog-com }
              - { label: "Jadlog .Package", value: jadlog-package }
              - { label: "Loggi", value: loggi }
              - { label: "J&T Express", value: jet }
          - { label: "Motoboy: ligado", name: motoboy_ativo, widget: boolean, required: false, default: true, hint: "Entrega no mesmo dia nos CEPs abaixo." }
          - { label: "Motoboy: valor (R$)", name: motoboy_valor, widget: number, value_type: float, step: 0.01, min: 0, required: false, default: 10, hint: "Não entra no frete grátis." }
          - { label: "Motoboy: horário limite para entregar no mesmo dia", name: motoboy_corte, widget: string, required: false, default: "13:00", hint: "Formato 13:00. Depois disso, entrega no próximo dia de entrega." }
          - label: "Motoboy: dias de entrega"
            name: motoboy_dias
            widget: select
            multiple: true
            required: false
            options:
              - { label: Segunda, value: 1 }
              - { label: Terça, value: 2 }
              - { label: Quarta, value: 3 }
              - { label: Quinta, value: 4 }
              - { label: Sexta, value: 5 }
              - { label: Sábado, value: 6 }
              - { label: Domingo, value: 0 }
          - { label: "Motoboy: CEPs atendidos", name: motoboy_faixas, widget: text, required: false, hint: "Uma faixa por linha. Ex.: 'Guarulhos: 07000-000 a 07399-999', um CEP '03310-000' ou o começo do CEP '033'." }
          - { label: "Entrega com o carro da loja: raio (km)", name: carro_raio_km, widget: number, value_type: float, step: 0.1, min: 0, required: false, default: 2, hint: "Aviso interno no painel quando o cliente mora até esta distância da base (em linha reta, pelo CEP)." }
          - { label: "Dias para postar o pedido", name: dias_para_postar, widget: number, value_type: int, min: 0, required: false, default: 1, hint: "Somado ao prazo da transportadora que o cliente vê." }
          - { label: "Frete grátis a partir de (valor real)", name: frete_gratis_acima, widget: number, value_type: float, step: 0.01, min: 0, required: false, default: 0, hint: "Valor da compra (já com a promoção) a partir do qual o frete fica grátis. 0 = não usar." }
          - { label: "Frete grátis: valor anunciado no site", name: frete_gratis_exibir, widget: number, value_type: float, step: 0.01, min: 0, required: false, hint: "O valor que aparece escrito no site (ex.: 120). Em branco = o mesmo do valor real." }
          - label: "Frete grátis vale para"
            name: frete_gratis_regioes
            widget: select
            multiple: true
            required: false
            hint: "Regiões pelo CEP do cliente. Deixe vazio para o Brasil todo."
            options:
              - { label: "Sul (PR, SC, RS)", value: sul }
              - { label: "Sudeste (SP, RJ, MG, ES)", value: sudeste }
              - { label: "Demais regiões (Norte, Nordeste, Centro-Oeste)", value: outras }
          - { label: "Promoção: leve quantos óculos e ganhe 1", name: promo_leve, widget: number, value_type: int, min: 0, max: 10, required: false, default: 4, hint: "4 = leve 4 e pague 3 (o mais barato sai grátis). 0 = promoção desligada." }
          - label: "Promoção vale para"
            name: promo_categoria
            widget: select
            required: false
            default: oculos
            options:
              - { label: Óculos de sol, value: oculos }
              - { label: Relógios, value: relogios }
          - { label: "Desconto no Pix (%)", name: desconto_pix, widget: number, value_type: int, min: 0, max: 30, required: false, default: 5, hint: "Desconto sobre os produtos (não sobre o frete) quando o cliente paga no Pix. 0 = sem desconto." }
          - { label: Etiqueta do banner, name: banner_etiqueta, widget: string }
          - { label: Título do banner, name: banner_titulo, widget: string }
          - { label: Texto do banner, name: banner_texto, widget: text }
          - { label: "Imagem do banner (computador, 1920 x 600 px)", name: banner_imagem, widget: image, required: false, hint: "Opcional. Com imagem, ela aparece no lugar do banner de texto. Deixe vazio para manter o banner atual." }
          - { label: "Imagem do banner (celular, 1080 x 1080 px)", name: banner_imagem_celular, widget: image, required: false, hint: "Opcional. Se ficar vazio, o celular usa a imagem do computador." }
          - { label: "Página Óculos: banner (computador, 1920 x 600 px)", name: banner_oculos, widget: image, required: false, hint: "Aparece em lojaspstore.com.br/oculos. Vazio = título com fundo escuro." }
          - { label: "Página Óculos: banner (celular, 1080 x 1080 px)", name: banner_oculos_celular, widget: image, required: false }
          - { label: "Página Relógios: banner (computador, 1920 x 600 px)", name: banner_relogios, widget: image, required: false, hint: "Aparece em lojaspstore.com.br/relogios. Vazio = título com fundo escuro." }
          - { label: "Página Relógios: banner (celular, 1080 x 1080 px)", name: banner_relogios_celular, widget: image, required: false }
          - { label: "Foto do bloco 'Óculos de sol' na página inicial", name: categoria_oculos_img, widget: image, required: false, hint: "Vazio = usa a foto de um óculos." }
          - { label: "Foto do bloco 'Relógios' na página inicial", name: categoria_relogios_img, widget: image, required: false, hint: "Vazio = usa a foto de um relógio." }

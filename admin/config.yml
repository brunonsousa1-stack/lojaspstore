# Painel da SP Store (Decap CMS)
backend:
  name: github
  repo: brunonsousa1-stack/lojaspstore
  branch: main

locale: pt
site_url: https://lojaspstore.com.br
logo_url: https://lojaspstore.com.br/img/logo.png
media_folder: img
public_folder: /img

collections:
  - name: loja
    label: Minha loja
    editor: { preview: false }
    files:
      - name: produtos
        label: Produtos
        file: data/produtos.json
        fields:
          - label: Produtos
            name: produtos
            widget: list
            label_singular: produto
            summary: "{{fields.nome}} · R$ {{fields.preco}}"
            fields:
              - { label: Nome do produto, name: nome, widget: string }
              - { label: Preço, name: preco, widget: number, value_type: float, step: 0.01, min: 0, hint: "Use ponto nos centavos. Ex.: 29.99" }
              - label: Categoria
                name: categoria
                widget: select
                options:
                  - { label: Óculos de sol, value: oculos }
                  - { label: Relógios, value: relogios }
              - { label: Descrição curta, name: descricao, widget: text, required: false, hint: "Aparece embaixo do nome no site. Uma ou duas frases." }
              - { label: Selos, name: selos, widget: list, required: false, hint: "Etiquetas sobre a foto, separadas por vírgula. Ex.: Novo, Mais vendido" }
              - { label: Mostrar no site, name: ativo, widget: boolean, default: true }
              - label: Cores / versões
                label_singular: cor / versão
                name: variantes
                widget: list
                summary: "{{fields.nome}}"
                hint: "Produto sem opção de cor? Deixe só 1 item aqui."
                fields:
                  - { label: Nome da cor, name: nome, widget: string }
                  - { label: Foto principal, name: foto, widget: image, required: false, hint: "Quadrada, 1000 x 1000 px, JPG." }
                  - label: Mais fotos desta cor
                    label_singular: foto
                    name: fotos_extras
                    widget: list
                    required: false
                    field: { label: Foto, name: foto, widget: image }
                  - label: Opções avançadas
                    name: avancado
                    widget: object
                    collapsed: true
                    required: false
                    fields:
                      - { label: Cor principal da bolinha, name: cor_principal, widget: color, required: false, hint: "Usada só quando não há foto." }
                      - { label: Cor de detalhe da bolinha, name: cor_detalhe, widget: color, required: false }
              - label: Opções avançadas
                name: avancado
                widget: object
                collapsed: true
                required: false
                fields:
                  - label: Desenho usado quando não há foto
                    name: desenho
                    widget: select
                    required: false
                    default: hex
                    options:
                      - { label: Óculos hexagonal, value: hex }
                      - { label: Óculos aviador, value: avi }
                      - { label: Relógio redondo, value: round }
                      - { label: Relógio gota, value: drop }
                      - { label: Relógio digital, value: digital }
      - name: config
        label: Textos e contato
        file: data/loja.json
        fields:
          - { label: WhatsApp (só números, com 55 e DDD), name: whatsapp, widget: string }
          - { label: WhatsApp como aparece no site, name: whatsapp_exibicao, widget: string }
          - { label: Preço destaque do banner, name: preco_destaque, widget: number, value_type: float, step: 0.01 }
          - { label: Preço do kit óculos + relógio, name: preco_kit, widget: number, value_type: float, step: 0.01 }
          - { label: Etiqueta do banner, name: banner_etiqueta, widget: string }
          - { label: Título do banner, name: banner_titulo, widget: string }
          - { label: Texto do banner, name: banner_texto, widget: text }
          - { label: "Imagem do banner (computador, 1920 x 600 px)", name: banner_imagem, widget: image, required: false, hint: "Opcional. Com imagem, ela aparece no lugar do banner de texto. Deixe vazio para manter o banner atual." }
          - { label: "Imagem do banner (celular, 1080 x 1080 px)", name: banner_imagem_celular, widget: image, required: false, hint: "Opcional. Se ficar vazio, o celular usa a imagem do computador." }
          - { label: "Chave Pix da loja", name: pix_chave, widget: string, required: false, hint: "A chave Pix da conta Mercado Pago. CNPJ ou CPF só números; celular com +55 e DDD (ex.: +5511947523834); ou e-mail; ou chave aleatória. Vazio = o site não mostra a opção Pix." }
          - { label: "Nome que aparece no Pix", name: pix_nome, widget: string, required: false, hint: "Até 25 letras, sem acento. Ex.: SP STORE" }
          - { label: "Cidade do Pix", name: pix_cidade, widget: string, required: false, hint: "Até 15 letras, sem acento. Ex.: SAO PAULO" }
          - { label: "Frete fixo (R$)", name: frete_fixo, widget: number, value_type: float, step: 0.01, min: 0, required: false, hint: "Valor somado em todo pedido. Deixe 0 para combinar o frete pelo WhatsApp depois da compra." }

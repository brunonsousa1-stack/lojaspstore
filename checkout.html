<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Finalizar compra · SP Store</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/loja.css">
<style>
.lay{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.side{position:sticky;top:88px}
@media (max-width:880px){.lay{grid-template-columns:1fr}.side{position:static;order:-1}}
.step{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.step .n{flex:none;width:32px;height:32px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display)}
.step.done .n{background:var(--wa);color:#fff}
.step h2{font-size:22px}
.lockd{opacity:.5;pointer-events:none}
.who{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--bg);border-radius:12px;padding:12px 14px;font-size:14px}
.resumo summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.resumo summary::-webkit-details-marker{display:none}
.resumo summary .chev{transition:transform .2s}
.resumo[open] summary .chev{transform:rotate(180deg)}
@media (min-width:881px){.resumo summary{pointer-events:none}.resumo summary .chev{display:none}}
.pix{display:grid;gap:14px;justify-items:center;text-align:center}
.pix img{width:min(260px,100%);height:auto;border-radius:12px;background:#fff;padding:8px;border:1px solid var(--line)}
.pix .code{width:100%;text-align:left}
.wait{display:inline-flex;gap:10px;align-items:center;font-weight:600;color:var(--muted)}
.okbox{text-align:center;display:grid;gap:12px;justify-items:center;padding:12px 0}
.okbox .ic{width:72px;height:72px;border-radius:50%;background:var(--ok-soft);color:#17703c;display:grid;place-items:center}
.seguro{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:12px}
#pay-brick{min-height:120px}
</style>
</head><body>
<header class="top"><div class="wrap">
  <a href="/" aria-label="SP Store, voltar à loja"><img src="/img/logo.png" alt="SP Store"></a>
  <span class="lock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Compra segura</span>
  <a class="back" href="/">← Continuar comprando</a>
</div></header>

<main><div class="wrap" id="app"><p class="muted">Carregando…</p></div></main>
<footer class="foot"><div class="wrap"><span>© 2026 SP Store</span><span>Pagamento processado pelo Mercado Pago · Pix ou cartão</span></div></footer>

<script src="/js/conta.js"></script>
<script>
const CART_KEY="spstore_carrinho", ABERTO_KEY="spstore_pedido_aberto";
const $=s=>document.querySelector(s);
const app=$("#app");
const brl=n=>"R$ "+Number(n||0).toFixed(2).replace(".",",");
const cents=n=>Math.round(Number(n)*100);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const digitos=t=>String(t||"").replace(/\D/g,"");
const corTxt=c=>c&&c!=="Padrão"?c:"";
const lerJSON=(k,store=localStorage)=>{try{return JSON.parse(store.getItem(k)||"null")}catch(e){return null}};
const gravarJSON=(k,v,store=localStorage)=>{try{v==null?store.removeItem(k):store.setItem(k,JSON.stringify(v))}catch(e){}};

let CFG={}, LOJA={}, PRODUTOS=[], cart=[], pedido=null, aba="criar", brick=null, pollT=null;
const qs=new URLSearchParams(location.search);

function freteDe(sub){const v=Math.max(0,Number(LOJA.frete_valor)||0),g=Math.max(0,Number(LOJA.frete_gratis_acima)||0);return g>0&&sub>=g?0:v}
function sincronizar(){ // preço atual e itens que ainda existem
  cart=(cart||[]).map(it=>{const p=PRODUTOS.find(x=>x.nome===it.nome&&x.ativo!==false);if(!p)return null;const vs=p.variantes&&p.variantes.length?p.variantes:[{nome:"Padrão"}];const v=vs.find(x=>x.nome===it.cor);if(!v)return null;return{...it,preco:p.preco,foto:v.foto||it.foto||""}}).filter(Boolean);
}
const assinatura=()=>JSON.stringify(cart.map(x=>[x.nome,x.cor,x.qtd]));
function totais(){
  if(pedido) return {sub:pedido.subtotal,frete:pedido.frete,total:pedido.total,itens:pedido.itens};
  const sub=cart.reduce((a,x)=>a+cents(x.preco)*x.qtd,0)/100, frete=freteDe(sub);
  return {sub,frete,total:Math.round((sub+frete)*100)/100,itens:cart};
}
function resumoHTML(){
  const t=totais(), n=t.itens.reduce((a,x)=>a+x.qtd,0);
  const falta=Number(LOJA.frete_gratis_acima)>0&&!pedido&&t.frete>0?Number(LOJA.frete_gratis_acima)-t.sub:0;
  return `<details class="card resumo" open><summary><span>Resumo · ${n} ${n===1?"item":"itens"} · ${brl(t.total)}</span><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg></summary>
    <ul class="itens" style="margin-top:12px">${t.itens.map(x=>`<li><div class="th">${x.foto?`<img src="${esc(x.foto)}" alt="">`:""}</div><div><b>${esc(x.nome)}</b><span>${corTxt(x.cor)?esc(x.cor)+" · ":""}${x.qtd}×</span></div><div class="v">${brl(cents(x.preco)*x.qtd/100)}</div></li>`).join("")}</ul>
    <div class="tot"><div><span class="muted">Subtotal</span><span>${brl(t.sub)}</span></div><div><span class="muted">Frete</span><span>${t.frete>0?brl(t.frete):"Grátis"}</span></div>
    ${falta>0?`<div style="font-size:13px;color:var(--gold)">Faltam ${brl(falta)} para frete grátis</div>`:""}
    <div class="grand"><span>Total</span><strong>${brl(t.total)}</strong></div></div>
    ${pedido?`<p class="hint" style="margin-top:10px">Pedido #${pedido.id}</p>`:`<p class="hint" style="margin-top:10px"><a href="/#vitrine">Alterar itens no carrinho</a></p>`}</details>`;
}
function waLink(){
  const lines=cart.map(x=>`• ${x.qtd}x ${x.nome}${corTxt(x.cor)?` - ${x.cor}`:""} (${brl(cents(x.preco)*x.qtd/100)})`);
  const t=`Olá! Quero fazer este pedido pelo site da SP Store:\n\n${lines.join("\n")}\n\nTotal: ${brl(totais().total)}`;
  return `https://wa.me/${digitos(LOJA.whatsapp||"5511947523834")}?text=${encodeURIComponent(t)}`;
}

// ---------- telas ----------
function telaSimples(html){app.innerHTML=`<div style="max-width:560px;margin:0 auto">${html}</div>`}
function render(){
  const u=Conta.usuario(), logado=!!u||!!pedido, quem=u?u.email:(pedido&&pedido.email), d=(u&&u.user_metadata)||{}, end=d.endereco||{};
  app.innerHTML=`<div class="lay"><div>
    <section class="card" id="s-conta"><div class="step ${logado?"done":""}"><span class="n">${logado?"✓":"1"}</span><h2>Sua conta</h2></div>
      ${logado?`<div class="who"><span>Comprando como <b>${esc(quem)}</b></span>${pedido?"":`<button class="link" type="button" id="sair">Trocar de conta</button>`}</div>`:contaHTML()}
    </section>
    <section class="card ${logado?"":"lockd"}" id="s-entrega"><div class="step ${pedido?"done":""}"><span class="n">${pedido?"✓":"2"}</span><h2>Entrega</h2></div>
      ${pedido?entregaResumo(pedido):`<form class="form" id="f-entrega" novalidate>
        <label class="f">Nome completo<input class="in" name="nome" autocomplete="name" required value="${esc(d.nome||"")}"></label>
        <label class="f">Celular com DDD<input class="in" name="telefone" inputmode="tel" autocomplete="tel-national" placeholder="(11) 90000-0000" required value="${esc(fmtTel(d.telefone||""))}"></label>
        <div class="row r3"><label class="f">CEP<input class="in" name="cep" inputmode="numeric" autocomplete="postal-code" placeholder="00000-000" required value="${esc(fmtCep(end.cep||""))}"></label><span></span><span></span></div>
        <p class="hint" id="cep-msg"></p>
        <label class="f">Rua / Avenida<input class="in" name="rua" autocomplete="address-line1" required value="${esc(end.rua||"")}"></label>
        <div class="row"><label class="f">Número<input class="in" name="numero" inputmode="numeric" required value="${esc(end.numero||"")}"></label><label class="f">Complemento <small>(opcional)</small><input class="in" name="complemento" autocomplete="address-line2" value="${esc(end.complemento||"")}"></label></div>
        <label class="f">Bairro<input class="in" name="bairro" required value="${esc(end.bairro||"")}"></label>
        <div class="row r3"><label class="f">Cidade<input class="in" name="cidade" autocomplete="address-level2" required value="${esc(end.cidade||"")}"></label><span></span><label class="f">UF<input class="in" name="uf" maxlength="2" autocomplete="address-level1" required value="${esc(end.uf||"")}" style="text-transform:uppercase"></label></div>
        <div class="msg bad" id="e-msg" role="alert"></div>
        <button class="btn btn-dark btn-block" type="submit" id="e-go">Continuar para o pagamento</button>
      </form>`}
    </section>
    <section class="card ${pedido?"":"lockd"}" id="s-pag"><div class="step"><span class="n">3</span><h2>Pagamento</h2></div>
      ${pedido?`<div class="msg bad" id="p-msg" role="alert"></div><div id="pay-brick"><p class="wait"><span class="spin"></span>Carregando formas de pagamento…</p></div><div id="pix"></div>
      <p class="seguro"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Pagamento processado pelo Mercado Pago. Os dados do cartão não ficam salvos na SP Store. Não precisa ter conta no Mercado Pago.</p>`
      :`<p class="muted" style="margin:0">Pix ou cartão de crédito, sem sair do site.</p>`}
    </section>
  </div><aside class="side">${resumoHTML()}</aside></div>`;
  ligar();
  if(pedido) montarPagamento();
}
function contaHTML(){
  return `<div class="tabs" role="tablist"><button role="tab" type="button" data-aba="criar" aria-selected="${aba==="criar"}">Criar conta</button><button role="tab" type="button" data-aba="entrar" aria-selected="${aba==="entrar"}">Já tenho conta</button></div>
  ${aba==="criar"?`<form class="form" id="f-conta" novalidate>
    <p class="sub" style="margin:0">Com a conta você acompanha seus pedidos e o rastreio no site.</p>
    <label class="f">E-mail<input class="in" type="email" name="email" autocomplete="email" required></label>
    <label class="f">Crie uma senha<span class="pass"><input class="in" type="password" name="senha" autocomplete="new-password" required minlength="8"><button type="button" data-ver>Mostrar</button></span></label>
    <p class="hint">Pelo menos 8 caracteres, com letras e números.</p>
    <div class="msg bad" id="c-msg" role="alert"></div>
    <button class="btn btn-dark btn-block" type="submit">Criar conta e continuar</button></form>`
  :aba==="entrar"?`<form class="form" id="f-conta" novalidate>
    <label class="f">E-mail<input class="in" type="email" name="email" autocomplete="email" required></label>
    <label class="f">Senha<span class="pass"><input class="in" type="password" name="senha" autocomplete="current-password" required><button type="button" data-ver>Mostrar</button></span></label>
    <div class="msg bad" id="c-msg" role="alert"></div>
    <button class="btn btn-dark btn-block" type="submit">Entrar e continuar</button>
    <button class="link" type="button" data-aba="esqueci" style="justify-self:start">Esqueci a senha</button></form>`
  :`<form class="form" id="f-conta" novalidate><p class="sub" style="margin:0">Enviamos um link para você criar uma senha nova.</p>
    <label class="f">E-mail da conta<input class="in" type="email" name="email" autocomplete="email" required></label>
    <div class="msg" id="c-msg" role="alert"></div>
    <button class="btn btn-dark btn-block" type="submit">Enviar link</button>
    <button class="link" type="button" data-aba="entrar" style="justify-self:start">Voltar</button></form>`}`;
}
function entregaResumo(p){const a=p.endereco||{};return `<div class="who" style="display:block"><b>${esc(p.nome)}</b> · ${esc(fmtTel(p.telefone))}<br>${esc(a.rua)}, ${esc(a.numero)}${a.complemento?" - "+esc(a.complemento):""} · ${esc(a.bairro)}<br>${esc(a.cidade)}/${esc(a.uf)} · CEP ${esc(fmtCep(a.cep))}</div>`}
const fmtCep=v=>{v=digitos(v).slice(0,8);return v.length>5?v.slice(0,5)+"-"+v.slice(5):v};
const fmtTel=v=>{v=digitos(v).slice(0,11);if(v.length<3)return v;if(v.length<=6)return `(${v.slice(0,2)}) ${v.slice(2)}`;return v.length===11?`(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`:`(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`};

function carregando(btn,on,txt){if(!btn)return;if(on){btn.dataset.t=btn.innerHTML;btn.disabled=true;btn.innerHTML=`<span class="spin"></span>${txt||"Aguarde…"}`}else{btn.disabled=false;if(btn.dataset.t)btn.innerHTML=btn.dataset.t}}
function ligar(){
  app.querySelectorAll("[data-aba]").forEach(b=>b.addEventListener("click",()=>{aba=b.dataset.aba;render()}));
  app.querySelectorAll("[data-ver]").forEach(b=>b.addEventListener("click",()=>{const i=b.previousElementSibling;i.type=i.type==="password"?"text":"password";b.textContent=i.type==="password"?"Mostrar":"Ocultar"}));
  const s=$("#sair"); if(s) s.addEventListener("click",async()=>{await Conta.sair();aba="entrar";render()});
  const fc=$("#f-conta"); if(fc) fc.addEventListener("submit",enviarConta);
  const fe=$("#f-entrega"); if(fe){
    fe.addEventListener("submit",enviarEntrega);
    fe.cep.addEventListener("input",()=>{fe.cep.value=fmtCep(fe.cep.value);if(digitos(fe.cep.value).length===8)buscarCep(fe)});
    fe.telefone.addEventListener("input",()=>{fe.telefone.value=fmtTel(fe.telefone.value)});
  }
}
async function enviarConta(e){
  e.preventDefault(); const f=e.target, m=$("#c-msg"), btn=f.querySelector("[type=submit]"); m.textContent=""; m.className="msg bad";
  const email=f.email.value.trim();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.textContent="Digite um e-mail válido.";f.email.focus();return}
  try{
    if(aba==="esqueci"){carregando(btn,true,"Enviando…");await Conta.esqueci(email);m.className="msg ok";m.textContent=`Pronto! Se existir uma conta com ${email}, o link chega em instantes. Confira também o spam.`;carregando(btn,false);return}
    const senha=f.senha.value;
    if(aba==="criar"&&Conta.senhaFraca(senha)){m.textContent="A senha precisa ter pelo menos 8 caracteres, com letras e números.";f.senha.focus();return}
    carregando(btn,true,aba==="criar"?"Criando conta…":"Entrando…");
    if(aba==="criar"){
      const r=await Conta.criar(email,senha,{},location.origin+"/checkout.html");
      if(!r.entrou){ $("#s-conta").innerHTML=`<div class="step"><span class="n">1</span><h2>Confirme seu e-mail</h2></div>
        <div class="msg info"><b>Falta só um passo.</b> Enviamos um link de confirmação para <b>${esc(email)}</b>. Abra o e-mail da SP Store e toque em <b>Confirmar e-mail</b>: você volta para cá com o carrinho guardado.<br><br>Não chegou? Confira o spam ou a aba Promoções.</div>
        <p style="margin:14px 0 0"><button class="link" type="button" id="ja-confirmei">Já confirmei, quero entrar</button></p>`;
        $("#ja-confirmei").addEventListener("click",()=>{aba="entrar";render()}); return }
    }else await Conta.entrar(email,senha);
    await Conta.carregarUsuario(); render(); const n=document.querySelector("#f-entrega [name=nome]"); if(n&&!n.value) n.focus();
  }catch(err){carregando(btn,false);m.textContent=err.message}
}
async function buscarCep(f){
  const msg=$("#cep-msg"), cep=digitos(f.cep.value);
  msg.textContent="Buscando endereço…";
  try{const d=await fetch(`https://viacep.com.br/ws/${cep}/json/`).then(r=>r.json());
    if(d.erro){msg.textContent="CEP não encontrado. Preencha o endereço abaixo.";return}
    if(d.logradouro)f.rua.value=d.logradouro; if(d.bairro)f.bairro.value=d.bairro; f.cidade.value=d.localidade||""; f.uf.value=d.uf||"";
    msg.textContent=""; (d.logradouro?f.numero:f.rua).focus();
  }catch(e){msg.textContent="Não foi possível buscar o CEP. Preencha o endereço abaixo."}
}
async function enviarEntrega(e){
  e.preventDefault(); const f=e.target, m=$("#e-msg"), btn=$("#e-go"); m.textContent="";
  const req=["nome","telefone","cep","rua","numero","bairro","cidade","uf"]; let falta=null;
  req.forEach(k=>{const v=f[k].value.trim();const ruim=!v||(k==="cep"&&digitos(v).length!==8)||(k==="telefone"&&digitos(v).length<10)||(k==="uf"&&!/^[a-zA-Z]{2}$/.test(v))||(k==="nome"&&v.length<3);f[k].setAttribute("aria-invalid",ruim);if(ruim&&!falta)falta=f[k]});
  if(falta){m.textContent="Confira os campos destacados.";falta.focus();return}
  if(!cart.length){m.textContent="Seu carrinho está vazio.";return}
  carregando(btn,true,"Registrando pedido…");
  const corpo={nome:f.nome.value,telefone:f.telefone.value,endereco:{cep:f.cep.value,rua:f.rua.value,numero:f.numero.value,complemento:f.complemento.value,bairro:f.bairro.value,cidade:f.cidade.value,uf:f.uf.value},itens:cart.map(x=>({nome:x.nome,cor:x.cor,qtd:x.qtd}))};
  try{
    const r=await Conta.api("/api/checkout",{method:"POST",body:JSON.stringify(corpo)});
    const d=await Conta.api(`/api/pedido?id=${r.id}&t=${r.token}`);
    pedido=d.pedido; gravarJSON(ABERTO_KEY,{id:r.id,t:r.token,sig:assinatura()},sessionStorage);
    history.replaceState(null,"",`/checkout.html?pedido=${r.id}&t=${r.token}`);
    render(); $("#s-pag").scrollIntoView({behavior:"smooth",block:"start"});
  }catch(err){carregando(btn,false);m.textContent=err.status===401?"Sua sessão expirou. Entre de novo na conta.":err.message;if(err.status===401)render()}
}

// ---------- pagamento (Payment Brick do Mercado Pago) ----------
function carregarSDK(){return new Promise((ok,falha)=>{if(window.MercadoPago)return ok();const s=document.createElement("script");s.src="https://sdk.mercadopago.com/js/v2";s.onload=ok;s.onerror=()=>falha(new Error("sdk"));document.head.appendChild(s)})}
async function montarPagamento(){
  const box=$("#pay-brick"), pm=$("#p-msg");
  try{await carregarSDK()}catch(e){box.innerHTML="";pm.textContent="Não conseguimos carregar o pagamento. Confira sua internet e recarregue a página.";return}
  try{
    const mp=new MercadoPago(CFG.mpPublicKey,{locale:"pt-BR"});
    const [nome,...resto]=String(pedido.nome||"").split(" ");
    box.innerHTML="";
    brick=await mp.bricks().create("payment","pay-brick",{
      initialization:{amount:Number(pedido.total),payer:{email:pedido.email,firstName:nome,lastName:resto.join(" ")}},
      customization:{paymentMethods:{bankTransfer:["pix"],creditCard:"all",debitCard:"all",maxInstallments:12},visual:{style:{theme:matchMedia("(prefers-color-scheme: dark)").matches?"dark":"default",customVariables:{baseColor:"#b08a3e"}}}},
      callbacks:{
        onReady(){},
        onError(err){console.error(err)},
        onSubmit:({formData})=>new Promise(async(ok,falha)=>{
          pm.textContent="";
          try{const r=await Conta.api("/api/pagar",{method:"POST",body:JSON.stringify({id:pedido.id,t:pedido.token,formData})});
            pedido=r.pedido||pedido;
            if(r.status==="pago"){ok();sucesso();return}
            if(r.status==="pendente"&&r.pix){ok();mostrarPix(r.pix);return}
            if(r.status==="pendente"){ok();emAnalise(r.aviso);return}
            pm.textContent=r.erro||"Pagamento recusado. Tente outro cartão ou o Pix.";falha();
          }catch(err){pm.textContent=err.message;falha()}
        })
      }
    });
  }catch(e){box.innerHTML="";pm.textContent="Não conseguimos abrir o pagamento. Recarregue a página."}
}
function desmontar(){try{brick&&brick.unmount()}catch(e){} brick=null; const b=$("#pay-brick"); if(b) b.remove()}
function mostrarPix(px){
  desmontar(); const box=$("#pix");
  const exp=px.expira?new Date(px.expira):null;
  box.innerHTML=`<div class="pix">
    <div class="eyebrow">Pague com Pix</div>
    <h2 style="font-size:26px">${brl(pedido.total)}</h2>
    <p class="muted" style="margin:0;max-width:40ch">Abra o app do seu banco, escolha <b>Pix › Ler QR Code</b> ou use o <b>Pix Copia e Cola</b>.</p>
    ${px.qr_base64?`<img src="data:image/png;base64,${px.qr_base64}" alt="QR Code do Pix" width="260" height="260">`:""}
    <div class="code"><span id="pix-code">${esc(px.qr)}</span><button class="btn btn-gold btn-sm" type="button" id="copiar">Copiar código</button></div>
    ${exp?`<p class="hint" style="margin:0">O código vale até ${exp.toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}.</p>`:""}
    <p class="wait" id="pix-wait"><span class="spin"></span>Aguardando o pagamento… esta tela atualiza sozinha.</p>
    <p class="hint" style="margin:0">Pode fechar esta página: quando o Pix cair, enviamos a confirmação para <b>${esc(pedido.email)}</b>.</p></div>`;
  $("#copiar").addEventListener("click",function(){const t=$("#pix-code").textContent,b=this;navigator.clipboard.writeText(t).then(()=>{b.textContent="Copiado ✓"}).catch(()=>{const r=document.createRange();r.selectNodeContents($("#pix-code"));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent="Selecionado"})});
  esperarPagamento();
}
function emAnalise(aviso){desmontar();$("#pix").innerHTML=`<div class="msg info">${esc(aviso||"Pagamento em análise. Avisamos por e-mail assim que for aprovado.")}</div><p style="margin:14px 0 0"><a class="btn btn-dark" href="/conta.html#pedido-${pedido.id}">Acompanhar pedido</a></p>`;limparCarrinho();esperarPagamento()}
function esperarPagamento(){
  clearTimeout(pollT); let n=0;
  const tick=async()=>{n++;try{const d=await Conta.api(`/api/pedido?id=${pedido.id}&t=${pedido.token}`);pedido=d.pedido;if(pedido.status!=="aguardando_pagamento"){sucesso();return}}catch(e){}
    if(n<360) pollT=setTimeout(tick,n<60?5000:15000)};
  pollT=setTimeout(tick,5000);
}
function limparCarrinho(){cart=[];gravarJSON(CART_KEY,[]);gravarJSON(ABERTO_KEY,null,sessionStorage)}
function sucesso(){
  clearTimeout(pollT); desmontar(); limparCarrinho();
  if(pedido.status==="cancelado"){telaSimples(`<div class="card"><h2>Pedido cancelado</h2><p class="muted">Este pedido foi cancelado. Se precisar de ajuda, fale com a gente no WhatsApp.</p><a class="btn btn-dark" href="/">Voltar à loja</a></div>`);return}
  telaSimples(`<div class="card okbox">
    <div class="ic"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"/></svg></div>
    <div class="eyebrow">Pedido #${pedido.id}</div>
    <h1 style="font-size:32px">Compra confirmada!</h1>
    <p class="muted" style="margin:0;max-width:42ch">Pagamento aprovado${pedido.forma_pagamento?` (${esc(pedido.forma_pagamento)})`:""}. Enviamos os detalhes para <b>${esc(pedido.email)}</b>. Você acompanha o pedido e o rastreio na sua conta.</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px"><a class="btn btn-dark" href="/conta.html#pedido-${pedido.id}">Ver meu pedido</a><a class="btn btn-line" href="/">Voltar à loja</a></div></div>
    <div class="card">${resumoHTML()}</div>`);
  const d=document.querySelector(".card .resumo"); if(d){d.classList.remove("card");d.style.padding="0"}
}

  let ref=qs.get("pedido")&&qs.get("t")?{id:qs.get("pedido"),t:qs.get("t")}:null;
  const aberto=lerJSON(ABERTO_KEY,sessionStorage);
  if(!ref&&aberto&&aberto.sig===assinatura()) ref=aberto;

  if(!pedido&&!cart.length){telaSimples(`<div class="card" style="text-align:center"><h2>Seu carrinho está vazio</h2><p class="muted">Escolha um óculos ou relógio e toque em "Adicionar ao carrinho".</p><a class="btn btn-dark" href="/#vitrine">Ver produtos</a></div>`);return}
